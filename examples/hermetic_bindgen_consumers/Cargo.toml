[package]
name = "hermetic-bindgen-consumers"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[dependencies]
aic-sdk-sys = { version = "=0.21.3", default-features = false, features = ["runtime-linking"] }
netstat2 = "=0.11.2"
bindgen = "=0.72.1"
quote = "1"
syn = { version = "2", features = ["full"] }
